<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#23483d">
  <title>Request Received | Love In Action</title>
  <style>
    :root { --paper:#fdfaf5; --ink:#26332e; --muted:#64716a; --green:#23483d; --line:#ded9cf; --white:#fffefa; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--paper); color:var(--ink); font-family:"Google Sans","Segoe UI",Arial,sans-serif; line-height:1.6; }
    main { width:min(100%,620px); padding:clamp(28px,6vw,56px); background:var(--white); border:1px solid var(--line); text-align:center; }
    .mark { width:48px; height:48px; margin:0 auto 22px; display:grid; place-items:center; border-radius:50%; background:var(--green); color:var(--paper); font: .9rem Georgia,serif; }
    .eyebrow { margin:0 0 10px; color:#92734c; font-size:.72rem; font-weight:750; letter-spacing:.17em; text-transform:uppercase; }
    h1 { margin:0 0 14px; font:400 clamp(2.2rem,6vw,3.6rem)/1.08 Georgia,"Times New Roman",serif; }
    p { color:var(--muted); }
    a { display:inline-block; margin-top:14px; padding:13px 21px; background:var(--green); color:white; text-decoration:none; font-weight:700; }
    a:hover { background:#19392f; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">LIA</div>
    <p class="eyebrow">Love In Action · Go-Bag Program</p>
    <h1>Thank you.</h1>
    <p>Your Go-Bag request has been submitted. Kay will review the information and follow up using the contact details you provided.</p>
    <a href="https://chasecountydetainees.com/">Return to Love In Action</a>
  </main>
</body>
</html>
